plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.mikelekan.artgallery'
version = '0.0.1-SNAPSHOT'
description = 'art-gallery-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation("org.projectlombok:lombok:1.18.42")
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'software.amazon.awssdk:s3:2.21.1'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.stripe:stripe-java:31.2.0'
    testImplementation 'junit:junit:4.13.2'

    // Spring Security: Core security framework
    // What it does: Intercepts HTTP requests, manages authentication/authorization
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT Library: Create and validate JWT tokens
    // What it does: Generates signed tokens, verifies signatures, extracts claims
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        // Use the Google Java Format
        eclipse().configFile('eclipse-style.xml')

        // Fix common issues like misplaced imports
        importOrder()
        removeUnusedImports()

        // Ensure every file ends with a newline
        trimTrailingWhitespace()
        endWithNewline()
    }
}
