# Server Port (Optional, default is 8080)
server.port=8080

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/artgallery
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
jwt.secret=${secret}
# This helps during startup to wait for the DB
spring.datasource.hikari.initialization-fail-timeout=0
# Max file size allowed (e.g., 10MB)
spring.servlet.multipart.max-file-size=10MB
# Max total request size (e.g., 11MB to account for text fields + image)
spring.servlet.multipart.max-request-size=11MB
stripe_secret_key=${STRIPE_SECRET_KEY}
stripe_currency=usd
# You'll get this from the Stripe CLI later
stripe_webhook_secret=whsec_935a596a697562a1a53b88ac19b994b3ab9ed67884b629b0834504b12c4efd35
logging.level.org.springframework.security=DEBUG


